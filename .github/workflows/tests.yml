name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DEMO_DATA: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r demo/requirements.txt
      - name: Unit and acceptance tests (no model calls)
        run: python -m unittest discover -s demo/tests -v
      - name: Offline baselines must reproduce exactly
        working-directory: validation/scripts
        run: |
          python score.py extract_haiku extract_haiku_mask
          DOCS_DIR=docs_holiday python score.py extract_haiku_docs_holiday extract_haiku_mask_docs_holiday
          python test_privacy.py
          cd ../.. && git diff --exit-code -- validation/results
