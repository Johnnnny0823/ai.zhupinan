name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DEMO_DATA: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r demo/requirements-dev.txt
      - name: Acceptance tests (no model calls)
        run: python -m pytest demo/tests -q
      - name: Offline baseline replay
        run: python -m demo.verify_baseline
      - name: Service Worker boundary tests
        run: node --test demo/tests/sw_test.cjs
