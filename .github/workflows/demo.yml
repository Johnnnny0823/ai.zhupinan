name: Finals demo acceptance
on:
  push:
    branches: [release/hackathon-2026]
  pull_request:
jobs:
  acceptance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r demo/requirements-dev.txt
      - run: python -m pytest demo/tests -q
      - run: python -m demo.verify_baseline
      - run: python validation/scripts/test_privacy.py
      - run: node --check demo/web/app.js
      - run: node --check demo/web/local-demo.js
      - run: node --test demo/tests/sw_test.cjs
