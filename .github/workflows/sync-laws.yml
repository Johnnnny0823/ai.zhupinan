name: Sync official law snapshots

on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-law-snapshot
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot and indexing dependencies
        run: python -m pip install -c demo/requirements.lock.txt httpx -r demo/requirements-law-sync.txt -r demo/requirements-vector.txt
      - name: Fetch official laws and validate the new Qdrant collection
        run: python -m demo.sync_laws --index
      - name: Publish the changed public-law snapshot
        run: |
          git add -- demo/law_data/current.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync public law snapshot'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
