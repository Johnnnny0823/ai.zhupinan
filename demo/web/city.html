<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c2822"><title>竹聘安｜新竹市地圖</title><meta name="description" content="新竹市東區、北區、香山區的高齡人口立體地圖。"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/app.css"><script src="/city.js" type="module"></script></head>
<body class="city-page">
<a class="skip" href="#main">跳到主要內容</a>
<header class="masthead city-head"><a class="brand" href="/" aria-label="竹聘安首頁"><span class="brand-mark" aria-hidden="true">竹</span><span>竹聘安<span class="brand-sub">市府視角</span></span></a><a href="/">回到首頁 ↗</a></header>
<main id="main" class="city" tabindex="-1">
  <section class="city-panel">
    <div class="eyebrow">市府視角</div>
    <h1>新竹市高齡人口</h1>
    <div class="city-switch" role="group" aria-label="切換數字">
      <button data-metric="age65" aria-pressed="true">65 歲以上</button>
      <button data-metric="age80" aria-pressed="false">80 歲以上</button>
      <button data-metric="ratio" aria-pressed="false">比例</button>
    </div>
    <div id="city-detail" class="city-detail" aria-live="polite"></div>
    <table class="city-table" id="city-table"><caption class="visually-hidden">各區人口</caption></table>
    <p class="city-note" id="city-source"></p>
  </section>
  <section class="city-stage" aria-label="新竹市三區立體地圖">
    <div id="city-canvas" class="city-canvas"></div>
    <div id="city-labels" class="city-labels"></div>
    <div class="city-stat" aria-hidden="true"><span id="stat-label">65 歲以上</span><strong id="stat-value">0</strong><span id="stat-where">新竹市</span></div>
    <div class="city-compass" aria-hidden="true"><span>N</span></div>
  </section>
</main>
</body></html>
